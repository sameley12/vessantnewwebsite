    <!--
      "Archivo Expanded" is not a distinct Google Fonts family — Archivo ships wdth
      as a real variable axis, so the expanded cut is requested as wdth=125 on the
      same family and applied in CSS via font-stretch: expanded (see index.css).
      Deliberately discrete instances (not a wdth/wght range) to keep the font
      payload to only the 6 cuts the type scale in the spec actually uses.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;100,500;100,600;100,700;125,700;125,800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
